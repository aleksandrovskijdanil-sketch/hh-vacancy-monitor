# Настройки монитора. Скопируйте под себя — секреты живут в .env, здесь только правила.

[search]
# Каждый запрос — отдельный поиск на hh.ru; дубликаты склеиваются.
queries = [
  "вайбкодер",
  "n8n",
  "AI-автоматизация",
  "автоматизация python",
  "telegram бот python",
  "аналитик-автоматизатор",
  "junior python",
  "стажер python",
  "разметка данных",
  "тестировщик стажер",
  "контент-менеджер маркетплейс",
  "оператор ввода данных excel",
]
schedule = "remote"            # remote / flexible / fullDay / shift; пусто — любой график
area = 113                     # 113 — вся Россия, 2 — Санкт-Петербург, 1 — Москва
experience = []                # ["noExperience", "between1And3"] — сузить по опыту; [] — любой
employment = []                # ["full", "part", "project", "probation"]; [] — любая
search_period_days = 1         # только опубликованные за последние N дней (1/3/7/30)
pages = 2                      # страниц выдачи на запрос (по 50 вакансий)
delay_seconds = 1.5            # пауза между запросами — hh.ru не любит спешку

[filter]
include_keywords = []          # оставить только названия с этими словами; [] — не сужать
exclude_keywords = ["senior", "lead", "руководитель", "1с", "1c", "team lead", "head of", "директор"]
exclude_companies = []
min_salary = 0                 # 0 — не отсекать по зарплате
allowed_experience = []        # ["noExperience", "between1And3"]
remote_only = true
max_responses = 600            # перегретые вакансии (600+ откликов) не показываем

# Не удаляем, а помечаем: однотипные объявления кадровых «центров» и т.п.
suspicious_companies = ["ТИРА", "ЛИАНДРА", "RECRUIT GROUP", "ПРОФСТРОЙ", "Центр занятости", "ЕЦТ", "TECHNO"]
suspicious_title_patterns = [
  "начинающ\\w+ специалист по (заявкам|обращениям)",
  "сотрудник по (работе с|обработке) (пользовател|обращен|заяв)",
  "оператор (онлайн-)?чата",
]

[export]
db_path = "data/hhmon.sqlite3"
excel_path = "out/vacancies.xlsx"
csv_path = "out/vacancies.csv"

[telegram]
enabled = false                # true — слать дайджест новых вакансий в Telegram
bot_token_env = "TG_BOT_TOKEN"
chat_id_env = "TG_CHAT_ID"

[llm]
enabled = false                # true — писать сопроводительные письма для новых вакансий
base_url = "https://api.openai.com/v1"   # или https://api.deepseek.com/v1, https://openrouter.ai/api/v1, http://localhost:11434/v1
model = "gpt-4o-mini"
api_key_env = "LLM_API_KEY"
profile_path = "profile.md"
max_letters_per_run = 10
